name: Build VST2 DLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build_vst2.bat nopause

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPitchPro-VST2
          path: AutoPitchPro.dll

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vst2-${{ github.run_number }}
          name: Auto-Pitch Pro VST2 ${{ github.run_number }}
          files: AutoPitchPro.dll
